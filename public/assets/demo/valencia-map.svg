<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Mapa esquemático local de Valencia</title>
  <desc id="desc">Fondo cartográfico de demostración con el centro histórico, el Jardín del Turia, los barrios marítimos y el Mediterráneo.</desc>
  <defs>
    <pattern id="blocks" width="62" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
