      <path d="M8 8H54V38H8Z" fill="#ebe3d7"/>
    </pattern>
    <linearGradient id="sea" x1="0" x2="1">
      <stop offset="0" stop-color="#b9d9dc"/>
      <stop offset="1" stop-color="#8fc2ca"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="850" fill="#f4efe6"/>
  <rect width="1015" height="850" fill="url(#blocks)"/>

