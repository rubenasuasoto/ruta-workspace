<header class="topbar">
  <a class="brand" routerLink="/" (click)="closeMenu()" aria-label="Ruta, inicio"><span>R</span> ruta</a>
  @if (auth.authenticated()) {
    <button class="menu-button" type="button" (click)="menuOpen.set(!menuOpen())" [attr.aria-expanded]="menuOpen()" aria-label="Abrir menú">☰</button>
    <nav [class.open]="menuOpen()" aria-label="Navegación principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Inicio</a>
      <a routerLink="/viajes" routerLinkActive="active" (click)="closeMenu()">Mis viajes</a>
      <a routerLink="/lugares" routerLinkActive="active" (click)="closeMenu()">Lugares</a>
      <span class="user-name">{{ auth.user()?.name }}</span>
      <button class="logout" type="button" (click)="logout()">Salir</button>
    </nav>
  } @else if (auth.initialized()) {
    <nav class="guest-nav" aria-label="Acceso">
      <a routerLink="/acceso" routerLinkActive="active">Acceder</a>
      <a class="register-link" routerLink="/registro">Crear cuenta</a>
    </nav>
  }
</header>
@if (auth.authenticated() && trips.loading() && !trips.initialized()) {
  <div class="loading-line" role="status"><span></span><span class="sr-only">Cargando tus viajes</span></div>
}
<main><router-outlet /></main>
<app-feedback />
